data_dir = "/var/lib/signal-bot"
personalities_dir = "/etc/signal-bot/personalities"
signal_bin = "/usr/local/bin/signal-cli"
signal_account = "+14433996053"
ollama_url = "http://127.0.0.1:11434"
# 0.0.0.0 listens on ALL network interfaces, not just the LAN -- a home box's LAN
# IP is often DHCP-assigned, so binding to a fixed address isn't always practical.
# You MUST firewall port 8443 to LAN-only access (e.g. ufw/iptables rule scoped to
# your LAN subnet), or set this to a specific LAN IP instead of 0.0.0.0.
bind_addr = "0.0.0.0:8443"
cert_path = "/etc/signal-bot/tls/bot.local.crt"
key_path  = "/etc/signal-bot/tls/bot.local.key"
debug = false
dry_run = false

# --- Optional: seed defaults for the `settings` table (row id=1) ---
# These populate the DB-backed settings on first run (admin UI can change them
# afterward). All are optional; the commented-out values below are the defaults.
# keep_alive = "30m"
# ollama_timeout_secs = 300
# repeat_penalty = 1.3
# repeat_last_n = 256
# num_predict = 512
# num_ctx = 8192
# default_temperature = 0.7
# default_top_p = 0.9
# summary_enabled = true
# summary_interval_hours = 6
# tools_enabled = false
# web_search_enabled = false
# max_tool_rounds = 2
# search_whitelist = "wikipedia.org,reuters.com,..."   # editable live in the Settings UI

# --- Web-search provider API key (SECRET) ---
# Required only if you enable web search. Kept here (root-owned config), NEVER in
# the DB or the web UI. Get a key from https://tavily.com and paste it below.
# search_api_key = "tvly-xxxxxxxxxxxxxxxxxxxxxxxxxxxx"
