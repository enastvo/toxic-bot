<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Signal Bot{% endblock %}</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #0b0d10;
    color: #e6e6e6;
  }
  header {
    padding: 1rem 1.5rem;
    background: #14171b;
    border-bottom: 1px solid #262b31;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header a.brand { color: #e6e6e6; text-decoration: none; font-weight: 600; }
  main { padding: 1.5rem; max-width: 960px; margin: 0 auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #262b31; }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    background: #20262d;
    font-size: 0.8rem;
    margin-left: 0.4rem;
  }
  form.inline { display: inline-flex; gap: 0.5rem; align-items: center; margin: 0 1rem 1rem 0; }
  input, select, button {
    background: #14171b;
    border: 1px solid #2c333b;
    color: #e6e6e6;
    padding: 0.4rem 0.6rem;
    border-radius: 6px;
    font-size: 0.9rem;
  }
  button { cursor: pointer; }
  button:hover { border-color: #4a5560; }
  .msg { padding: 0.4rem 0; border-bottom: 1px solid #1c2126; }
  .msg .who { font-weight: 600; margin-right: 0.5rem; }
  .msg .who.assistant { color: #7fb0ff; }
  .error { color: #ff8080; }
  a { color: #7fb0ff; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">Signal Bot</a>
  <form method="post" action="/logout"><button type="submit">Log out</button></form>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
