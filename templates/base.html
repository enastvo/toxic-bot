<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Signal Bot{% endblock %}</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #0b0d10;
    color: #e6e6e6;
  }
  header {
    padding: 1rem 1.5rem;
    background: rgba(16, 19, 23, 0.82);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid #262b31;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header a.brand { color: #e6e6e6; text-decoration: none; font-weight: 600; }
  .header-left { display: flex; align-items: center; }
  .nav { display: flex; gap: 1.25rem; margin-left: 1.75rem; }
  .nav a {
    color: #9aa4af;
    text-decoration: none;
    font-size: 0.9rem;
    padding: 0.25rem 0.1rem;
    border-bottom: 2px solid transparent;
  }
  .nav a:hover { color: #e6e6e6; }
  .nav a.active { color: #7fb0ff; border-bottom-color: #7fb0ff; }
  main { padding: 1.5rem; max-width: 960px; margin: 0 auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #262b31; }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    background: #20262d;
    font-size: 0.8rem;
    margin-left: 0.4rem;
  }
  form.inline { display: inline-flex; gap: 0.5rem; align-items: center; margin: 0 1rem 1rem 0; }
  input, select, button {
    background: #14171b;
    border: 1px solid #2c333b;
    color: #e6e6e6;
    padding: 0.4rem 0.6rem;
    border-radius: 6px;
    font-size: 0.9rem;
  }
  button { cursor: pointer; }
  button:hover { border-color: #4a5560; }
  .msg { padding: 0.4rem 0; border-bottom: 1px solid #1c2126; }
  .msg .who { font-weight: 600; margin-right: 0.5rem; }
  .msg .who.assistant { color: #7fb0ff; }
  .error { color: #ff8080; }
  .success { color: #7fd88f; }
  a { color: #7fb0ff; }

  /* Subdued painting backdrop. A fixed full-bleed layer sits behind all
     content; the logged-in ("app") variant is darker than the login one so
     the dense dashboard stays legible. */
  body.app, body.login {
    background: #05070a;
  }
  body.app::before, body.login::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  body.app::before { background-image: url(/assets/app-bg.jpg); }
  body.login::before { background-image: url(/assets/login-bg.jpg); }

  /* Login page: no dashboard chrome, form centered in a translucent card. */
  body.login header { display: none; }
  body.login main {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    background: rgba(16, 19, 23, 0.80);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid #2c333b;
    border-radius: 12px;
    padding: 1.75rem 2.1rem;
    width: min(92vw, 360px);
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.55);
  }
  .login-card h1 { margin-top: 0.2rem; }
</style>
</head>
<body class="{% block body_class %}app{% endblock %}">
<header>
  <div class="header-left">
    <a class="brand" href="/">Signal Bot</a>
    <nav class="nav">{% block nav %}{% endblock %}</nav>
  </div>
  <form method="post" action="/logout"><button type="submit">Log out</button></form>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
